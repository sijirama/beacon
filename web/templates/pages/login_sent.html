{{define "title"}}Check your email{{end}}

{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md rounded-xl border border-gray-100 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.04)] overflow-hidden text-center">
    <div class="px-6 pt-8 pb-6 bg-gradient-to-b from-emerald-50/70 to-white border-b border-gray-100">
      <div class="mx-auto mb-4 flex h-11 w-11 items-center justify-center rounded-full border border-emerald-100 bg-white text-emerald-600">
        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.5 5.5 4 5.5-4"/><path d="M5.75 5h8.5A1.75 1.75 0 0 1 16 6.75v6.5A1.75 1.75 0 0 1 14.25 15h-8.5A1.75 1.75 0 0 1 4 13.25v-6.5A1.75 1.75 0 0 1 5.75 5Z"/></svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight mb-2">Check your email</h1>
      <p class="text-sm text-gray-500">
        If <span class="font-mono text-gray-800">{{.Email}}</span> is allowed to sign in, a link should arrive shortly.
      </p>
    </div>
    <div class="px-6 py-8">
      <p class="text-xs text-gray-400">The link expires in 15 minutes.</p>
      <a href="/login" class="inline-flex items-center gap-1 mt-6 text-sm text-gray-500 hover:text-gray-900">
        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5 7 10l5 5"/></svg>
        <span>Back</span>
      </a>
    </div>
  </div>
</div>
{{end}}
