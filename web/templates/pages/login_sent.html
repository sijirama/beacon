{{define "title"}}Check your email{{end}}

{{define "content"}}
<div class="max-w-sm mx-auto py-16 text-center">
  <h1 class="text-2xl font-semibold tracking-tight mb-2">Check your email</h1>
  <p class="text-sm text-gray-500 mb-6">
    If <span class="font-mono text-gray-800">{{.Email}}</span> is allowed to sign in, you'll receive a link shortly.
  </p>
  <p class="text-xs text-gray-400">The link expires in 15 minutes.</p>
  <a href="/login" class="inline-block mt-8 text-sm text-gray-500 hover:text-gray-900">← Back</a>
</div>
{{end}}
