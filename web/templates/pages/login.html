{{define "title"}}Sign in{{end}}

{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="w-full max-w-md rounded-xl border border-gray-100 bg-white shadow-[0_1px_2px_rgba(15,23,42,0.04)] overflow-hidden">
    <div class="px-6 pt-6 pb-5 border-b border-gray-100 bg-gradient-to-b from-sky-50/70 to-white">
      <div class="inline-flex items-center gap-2 rounded-md border border-sky-100 bg-white/80 px-2.5 py-1 text-xs font-medium text-sky-700 mb-4">
        <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.75 6.75h8.5A1.75 1.75 0 0 1 16 8.5v5.75A1.75 1.75 0 0 1 14.25 16h-8.5A1.75 1.75 0 0 1 4 14.25V8.5a1.75 1.75 0 0 1 1.75-1.75Z"/><path d="m5 7 5 4 5-4"/></svg>
        <span>Magic link sign-in</span>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight mb-2">Sign in to Beacon</h1>
      <p class="text-sm text-gray-500">Enter your email and we’ll send you a one-time sign-in link.</p>
    </div>

    <div class="px-6 py-8">
      {{if .Error}}
      <div class="mb-4 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{.Error}}
      </div>
      {{end}}

      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" id="email" name="email" required autofocus
                 class="input"
                 placeholder="you@example.com" />
        </div>
        <button type="submit" class="btn-primary w-full">Send sign-in link</button>
      </form>

      <p class="mt-4 text-xs text-gray-400">If your email is allowed, the link should show up in a moment.</p>
    </div>
  </div>
</div>
{{end}}
