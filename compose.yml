services:
  beacon:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/beacon.db
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
