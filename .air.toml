root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/beacon ./cmd/server"
  bin = "./tmp/beacon"
  full_bin = "./tmp/beacon"
  include_ext = ["go", "html", "tmpl"]
  exclude_dir = ["tmp", "bin", "data", "node_modules", "web/static/dist", ".git"]
  delay = 500
  stop_on_error = true

[log]
  time = false

[color]
  main = "magenta"
  build = "yellow"
  runner = "green"
